<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>business AI — ИИ-ассистент для бизнес аналитиков</title>
<meta name="description" content="business AI — ИИ-ассистент для бизнес-аналитиков: транскрибация, планирование таблиц, проверка данных.">
<style>
:root{--bg:#fff6f8;--rose:#f6cfd9;--rose2:#fbe3e9;--deep:#8c4a5c;--ink:#4a2f38;--line:#ecc3cf}
@media (prefers-color-scheme:dark){:root{--bg:#2b1d22;--rose:#5a3441;--rose2:#38252c;--deep:#f3b9c8;--ink:#f7e8ec;--line:#6b4350}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Times New Roman",Times,serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.65}
.top{background:var(--rose2);border-bottom:1px solid var(--line);padding:8px 20px;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
#langs{display:flex;gap:6px;flex-wrap:wrap}
.top button{font:inherit;font-size:15px;background:none;border:1px solid transparent;color:var(--deep);padding:3px 12px;border-radius:2px;cursor:pointer}
.top button[aria-pressed=true]{background:var(--rose);border-color:var(--deep)}
.top button:focus-visible,nav button:focus-visible,summary:focus-visible,.send:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
header{text-align:center;padding:36px 20px 10px}
header img{width:min(440px,80%);height:auto;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){header img{mix-blend-mode:normal;border-radius:8px}}
h1{font-weight:400;font-size:clamp(30px,5vw,50px);line-height:1.15;margin:6px auto 8px;color:var(--deep);max-width:16em}
.sub{margin:0 auto;max-width:34em;font-style:italic}
nav{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:28px 0 0;border-bottom:1px solid var(--line)}
nav button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink);padding:10px 22px;cursor:pointer}
nav button[aria-current=page]{border-bottom-color:var(--deep);color:var(--deep)}
main{max-width:860px;margin:0 auto;padding:36px 22px 70px}
section{display:none}
section.on{display:block;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){section.on{animation:none}}
h2{font-weight:400;font-size:30px;color:var(--deep);margin:0 0 14px}
.lead{font-size:21px;margin:0 0 34px}
.feat{list-style:none;margin:0 0 40px;padding:0}
.feat li{display:grid;grid-template-columns:13em 1fr;gap:18px;padding:14px 0;border-top:1px solid var(--line)}
.feat li:last-child{border-bottom:1px solid var(--line)}
.feat b{font-weight:700;color:var(--deep)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line)}
.plan{padding:22px 16px;text-align:center;border-right:1px solid var(--line);transition:background .25s}
.plan:last-child{border-right:0}
.plan:hover,.plan.best{background:var(--rose)}
.plan .p{font-size:34px;color:var(--deep);display:block}
.note{font-size:16px;margin-top:12px;font-style:italic}
details{border-top:1px solid var(--line);padding:12px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-size:20px;color:var(--deep);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;font-size:24px;line-height:1}
details[open] summary::after{content:"\2212"}
details p{margin:10px 0 2px}
.team{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.team li{padding:14px 0;border-top:1px solid var(--line)}
.team span{display:block;font-style:italic;font-size:16px}
label{display:block;margin:0 0 18px;color:var(--deep)}
input,textarea{display:block;width:100%;font:inherit;margin-top:6px;padding:10px 12px;background:#fff;color:#3a2229;border:1px solid var(--line);border-radius:2px}
input:focus,textarea:focus{outline:2px solid var(--deep);border-color:var(--deep)}
textarea{min-height:150px;resize:vertical}
.send{font:inherit;background:var(--deep);color:#fff6f8;border:0;padding:11px 30px;cursor:pointer;transition:opacity .2s}
.send:hover{opacity:.85}
@media (prefers-color-scheme:dark){.send{color:#2b1d22}}
.top .try{font-size:16px;background:var(--deep);color:#fff6f8;padding:7px 22px;border-radius:2px;transition:opacity .2s}.top .try:hover{opacity:.85}
@media (prefers-color-scheme:dark){.top .try{color:#2b1d22}}
footer{text-align:center;padding:24px;border-top:1px solid var(--line);font-size:15px}
@media (max-width:640px){.feat li{grid-template-columns:1fr;gap:2px}.plans{grid-template-columns:1fr}.plan{border-right:0;border-bottom:1px solid var(--line)}.team{grid-template-columns:1fr}}
</style>
</head>
